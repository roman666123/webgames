<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块 — DongHaHa Games</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--accent:#f472b6;--text:#f0ede8;--muted:#6b6880;--border:rgba(244,114,182,0.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(244,114,182,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(244,114,182,0.03) 1px,transparent 1px);background-size:60px 60px}
nav{width:100%;max-width:580px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{text-decoration:none;color:var(--muted);font-size:13px;transition:color 0.2s}
.back:hover{color:var(--accent)}
.nav-title{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.wrap{position:relative;z-index:1;display:flex;gap:20px;align-items:flex-start;padding:0 16px 40px;flex-wrap:wrap;justify-content:center}
canvas{display:block;border-radius:12px;border:1px solid var(--border);background:#0d0a14}
.side{display:flex;flex-direction:column;gap:12px;min-width:120px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.box-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.box-val{font-family:'Dela Gothic One',sans-serif;font-size:1.4rem;color:var(--accent)}
.btn{padding:10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.2s;width:100%}
.btn:hover{background:var(--surface);border-color:var(--accent)}
.next-cv{display:block;margin:0 auto}
.hint{font-size:11px;color:var(--muted);line-height:1.8;text-align:center}
</style>
</head>
<body>
<nav>
  <a class="back" href="../index.html">← 返回</a>
  <div class="nav-title">俄罗斯方块</div>
  <div style="width:60px"></div>
</nav>
<div class="wrap">
  <canvas id="cv" width="200" height="400"></canvas>
  <div class="side">
    <div class="box"><div class="box-label">分数</div><div class="box-val" id="score">0</div></div>
    <div class="box"><div class="box-label">等级</div><div class="box-val" id="level">1</div></div>
    <div class="box"><div class="box-label">下一个</div><canvas id="next-cv" class="next-cv" width="80" height="80" style="margin-top:8px;background:#0d0a14;border-radius:6px;border:1px solid var(--border)"></canvas></div>
    <button class="btn" onclick="startGame()" id="startBtn">开始游戏</button>
    <div class="hint">← → 移动<br>↑ 旋转<br>↓ 加速<br>空格 直落</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ncv=document.getElementById('next-cv'),nctx=ncv.getContext('2d');
const COLS=10,ROWS=20,CS=20;
const COLORS=['','#f472b6','#fb923c','#fbbf24','#34d399','#60a5fa','#a78bfa','#f87171'];
const SHAPES=[
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[4,0],[4,0],[4,4]],
  [[0,5],[0,5],[5,5]],
  [[6,6,0],[0,6,6]],
  [[0,7,7],[7,7,0]]
];
let board,piece,next,score,level,lines,timer,running=false;

function newPiece(s){
  const shape=s||SHAPES[Math.floor(Math.random()*SHAPES.length)];
  return{shape,x:Math.floor(COLS/2)-Math.floor(shape[0].length/2),y:0};
}
function rotate(p){
  const r=p.shape[0].length,c=p.shape.length;
  const ns=Array.from({length:r},()=>Array(c).fill(0));
  p.shape.forEach((row,y)=>row.forEach((v,x)=>{ns[x][c-1-y]=v;}));
  return{...p,shape:ns};
}
function valid(p){
  return p.shape.every((row,y)=>row.every((v,x)=>!v||
    (p.x+x>=0&&p.x+x<COLS&&p.y+y>=0&&p.y+y<ROWS&&!board[p.y+y][p.x+x])));
}
function place(){
  piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v)board[piece.y+y][piece.x+x]=v;}));
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(v=>v)){board.splice(r,1);board.unshift(Array(COLS).fill(0));cleared++;r++;}
  }
  if(cleared){lines+=cleared;score+=cleared*100*level;level=Math.floor(lines/10)+1;
    document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;
    clearInterval(timer);timer=setInterval(tick,Math.max(80,500-level*40));}
  piece=next;next=newPiece();drawNext();
  if(!valid(piece)){running=false;clearInterval(timer);document.getElementById('startBtn').textContent='重新开始';alert('游戏结束！得分：'+score);}
}
function tick(){if(!running)return;const n={...piece,y:piece.y+1};if(valid(n))piece=n;else place();draw();}
function draw(){
  ctx.fillStyle='#0d0a14';ctx.fillRect(0,0,200,400);
  ctx.strokeStyle='rgba(244,114,182,0.05)';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,400);ctx.stroke();}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(200,i*CS);ctx.stroke();}
  board.forEach((row,y)=>row.forEach((v,x)=>{if(v){drawBlock(ctx,x,y,COLORS[v]);}}));
  // ghost
  let g={...piece};while(valid({...g,y:g.y+1}))g.y++;
  piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v)drawBlock(ctx,piece.x+x,g.y+y,COLORS[v],0.25);}));
  piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v)drawBlock(ctx,piece.x+x,piece.y+y,COLORS[v]);}));
}
function drawBlock(c,x,y,color,alpha=1){
  c.globalAlpha=alpha;
  c.fillStyle=color;c.fillRect(x*CS+1,y*CS+1,CS-2,CS-2);
  c.fillStyle='rgba(255,255,255,0.2)';c.fillRect(x*CS+1,y*CS+1,CS-2,4);
  c.globalAlpha=1;
}
function drawNext(){
  nctx.fillStyle='#0d0a14';nctx.fillRect(0,0,80,80);
  const s=next.shape,ox=(4-s[0].length)/2*CS/1.5,oy=(4-s.length)/2*CS/1.5;
  s.forEach((row,y)=>row.forEach((v,x)=>{if(v){
    nctx.fillStyle=COLORS[v];nctx.fillRect(ox+x*CS/1.5+1,oy+y*CS/1.5+1,CS/1.5-2,CS/1.5-2);
  }}));
}
function startGame(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=0;level=1;lines=0;running=true;
  document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;
  document.getElementById('startBtn').textContent='重新开始';
  next=newPiece();piece=newPiece();drawNext();
  clearInterval(timer);timer=setInterval(tick,500);draw();
}
document.addEventListener('keydown',e=>{
  if(!running)return;
  if(e.key==='ArrowLeft'){const n={...piece,x:piece.x-1};if(valid(n))piece=n;}
  else if(e.key==='ArrowRight'){const n={...piece,x:piece.x+1};if(valid(n))piece=n;}
  else if(e.key==='ArrowDown'){const n={...piece,y:piece.y+1};if(valid(n))piece=n;else place();}
  else if(e.key==='ArrowUp'){const n=rotate(piece);if(valid(n))piece=n;}
  else if(e.key===' '){e.preventDefault();while(valid({...piece,y:piece.y+1}))piece.y++;place();}
  else return;
  draw();
});
// touch
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!running)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<15&&Math.abs(dy)<15){const n=rotate(piece);if(valid(n)){piece=n;draw();}return;}
  if(Math.abs(dx)>Math.abs(dy)){const n={...piece,x:piece.x+(dx<0?-1:1)};if(valid(n)){piece=n;draw();}}
  else if(dy>0){while(valid({...piece,y:piece.y+1}))piece.y++;place();draw();}
},{passive:true});
draw();
</script>
</body>
</html>
