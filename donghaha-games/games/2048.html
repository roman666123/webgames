<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — DongHaHa Games</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--accent:#ff6b35;--text:#f0ede8;--muted:#6b6880;--border:rgba(255,107,53,0.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,107,53,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,53,0.03) 1px,transparent 1px);background-size:60px 60px}
nav{width:100%;max-width:520px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{text-decoration:none;color:var(--muted);font-size:13px;transition:color 0.2s}
.back:hover{color:var(--accent)}
.nav-title{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 16px 40px}
.top-row{display:flex;gap:12px;width:100%;max-width:400px;justify-content:space-between;align-items:center}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;text-align:center;min-width:90px}
.score-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted)}
.score-val{font-family:'Dela Gothic One',sans-serif;font-size:1.4rem;color:var(--accent)}
.btn{padding:10px 20px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.2s}
.btn:hover{background:var(--surface);border-color:var(--accent)}
.board{background:#1a1008;border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border:1px solid var(--border)}
.cell{width:88px;height:88px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Dela Gothic One',sans-serif;font-size:1.4rem;transition:all 0.1s;background:#2a1a08}
.msg{font-size:14px;color:var(--muted);text-align:center;min-height:20px}

/* tile colors */
.t2{background:#3d2b1a;color:#d4a574}
.t4{background:#4a2e10;color:#e8b570}
.t8{background:#ff6b35;color:#fff}
.t16{background:#ff5722;color:#fff}
.t32{background:#ff4500;color:#fff}
.t64{background:#e63900;color:#fff}
.t128{background:#ffd700;color:#1a1008;font-size:1.1rem}
.t256{background:#ffca28;color:#1a1008;font-size:1.1rem}
.t512{background:#ffb300;color:#1a1008;font-size:1rem}
.t1024{background:#ff8f00;color:#fff;font-size:0.9rem}
.t2048{background:#f57f17;color:#fff;font-size:0.85rem}
.tbig{background:#e53935;color:#fff;font-size:0.8rem}
</style>
</head>
<body>
<nav>
  <a class="back" href="../index.html">← 返回</a>
  <div class="nav-title">2048</div>
  <div style="width:60px"></div>
</nav>
<div class="wrap">
  <div class="top-row">
    <div class="score-box"><div class="score-label">分数</div><div class="score-val" id="score">0</div></div>
    <button class="btn" onclick="reset()">新游戏</button>
    <div class="score-box"><div class="score-label">最高</div><div class="score-val" id="best">0</div></div>
  </div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg">← → ↑ ↓ 方向键 或 WASD 移动</div>
</div>
<script>
let grid,score=0,best=parseInt(localStorage.getItem('2048best')||'0'),over=false;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const msgEl=document.getElementById('msg');
bestEl.textContent=best;

function reset(){
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0;over=false;
  scoreEl.textContent=0;msgEl.textContent='← → ↑ ↓ 方向键 或 WASD 移动';
  addRandom();addRandom();render();
}
function addRandom(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
  boardEl.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r][c];
    const d=document.createElement('div');
    d.className='cell'+(v?` t${v<=2048?v:'big'}`:'');
    d.textContent=v||'';
    boardEl.appendChild(d);
  }
  scoreEl.textContent=score;
  if(score>best){best=score;localStorage.setItem('2048best',best);bestEl.textContent=best;}
}
function slide(row){
  let arr=row.filter(x=>x);let merged=false,pts=0;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]&&!merged){arr[i]*=2;pts+=arr[i];arr.splice(i+1,1);merged=true;}else merged=false;
  }
  score+=pts;
  while(arr.length<4)arr.push(0);
  return arr;
}
function move(dir){
  if(over)return;
  const prev=JSON.stringify(grid);
  if(dir===0){for(let r=0;r<4;r++)grid[r]=slide(grid[r]);}
  else if(dir===1){for(let r=0;r<4;r++)grid[r]=slide([...grid[r]].reverse()).reverse();}
  else if(dir===2){for(let c=0;c<4;c++){let col=[0,1,2,3].map(r=>grid[r][c]);col=slide(col);col.forEach((v,r)=>grid[r][c]=v);}}
  else if(dir===3){for(let c=0;c<4;c++){let col=[3,2,1,0].map(r=>grid[r][c]);col=slide(col);col.reverse().forEach((v,r)=>grid[r][c]=v);}}
  if(JSON.stringify(grid)!==prev){addRandom();render();checkEnd();}
}
function checkEnd(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return;
    if(c<3&&grid[r][c]===grid[r][c+1])return;
    if(r<3&&grid[r][c]===grid[r+1][c])return;
    if(grid[r][c]===2048&&!over){over=true;msgEl.textContent='🎉 达成2048！继续挑战更高分！';return;}
  }
  over=true;msgEl.textContent='游戏结束！点击新游戏重试';
}
const keyMap={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,d:1,w:2,s:3,A:0,D:1,W:2,S:3};
document.addEventListener('keydown',e=>{
  if(keyMap[e.key]!==undefined){e.preventDefault();move(keyMap[e.key]);}
});
let tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx<0?0:1);else move(dy<0?2:3);
},{passive:true});
reset();
</script>
</body>
</html>
