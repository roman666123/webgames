<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 — DongHaHa Games</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--accent:#4ecdc4;--text:#f0ede8;--muted:#6b6880;--border:rgba(78,205,196,0.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(78,205,196,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(78,205,196,0.03) 1px,transparent 1px);background-size:60px 60px}
nav{width:100%;max-width:520px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{text-decoration:none;color:var(--muted);font-size:13px;transition:color 0.2s}
.back:hover{color:var(--accent)}
.nav-title{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px 40px}
.info-row{display:flex;gap:12px;align-items:center}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;text-align:center;min-width:90px}
.score-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted)}
.score-val{font-family:'Dela Gothic One',sans-serif;font-size:1.4rem;color:var(--accent)}
.btn{padding:10px 20px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.2s}
.btn:hover{background:var(--surface);border-color:var(--accent)}
canvas{display:block;border-radius:12px;border:1px solid var(--border)}
.msg{font-size:13px;color:var(--muted);min-height:20px}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;margin-top:8px}
.dpad button{width:48px;height:48px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;transition:background 0.15s}
.dpad button:active{background:var(--surface)}
.dpad .empty{visibility:hidden}
</style>
</head>
<body>
<nav>
  <a class="back" href="../index.html">← 返回</a>
  <div class="nav-title">贪吃蛇</div>
  <div style="width:60px"></div>
</nav>
<div class="wrap">
  <div class="info-row">
    <div class="score-box"><div class="score-label">分数</div><div class="score-val" id="score">0</div></div>
    <button class="btn" onclick="startGame()" id="startBtn">开始游戏</button>
    <div class="score-box"><div class="score-label">最高</div><div class="score-val" id="best">0</div></div>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <div class="msg" id="msg">按空格键或点击"开始游戏"</div>
  <div class="dpad">
    <div class="empty"></div>
    <button onclick="setDir(0,-1)">↑</button>
    <div class="empty"></div>
    <button onclick="setDir(-1,0)">←</button>
    <div class="empty"></div>
    <button onclick="setDir(1,0)">→</button>
    <div class="empty"></div>
    <button onclick="setDir(0,1)">↓</button>
    <div class="empty"></div>
  </div>
</div>
<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const COLS=20,ROWS=20,CS=20;
let snake,food,dx,dy,ndx,ndy,score,best=parseInt(localStorage.getItem('snakebest')||'0'),timer,running=false;
document.getElementById('best').textContent=best;

function draw(){
  ctx.fillStyle='#0d1a18';ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='rgba(78,205,196,0.06)';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,400);ctx.stroke();}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(400,i*CS);ctx.stroke();}
  snake.forEach((s,i)=>{
    const r=i===0?3:2;
    ctx.fillStyle=i===0?'#4ecdc4':`rgba(78,205,196,${0.9-i*0.03>0.3?0.9-i*0.03:0.3})`;
    ctx.beginPath();ctx.roundRect(s.x*CS+1,s.y*CS+1,CS-2,CS-2,r);ctx.fill();
  });
  ctx.fillStyle='#ff6b35';
  ctx.beginPath();ctx.arc(food.x*CS+CS/2,food.y*CS+CS/2,CS/2-2,0,Math.PI*2);ctx.fill();
}

function randomFood(){
  let f;do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}

function startGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dx=1;dy=0;ndx=1;ndy=0;score=0;
  document.getElementById('score').textContent=0;
  food=randomFood();running=true;
  document.getElementById('msg').textContent='方向键 / WASD 控制';
  clearInterval(timer);timer=setInterval(tick,130);
  draw();
}

function tick(){
  dx=ndx;dy=ndy;
  const head={x:(snake[0].x+dx+COLS)%COLS,y:(snake[0].y+dy+ROWS)%ROWS};
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(timer);running=false;
    document.getElementById('msg').textContent=`游戏结束！得分 ${score}，按空格重试`;
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;document.getElementById('score').textContent=score;
    if(score>best){best=score;localStorage.setItem('snakebest',best);document.getElementById('best').textContent=best;}
    food=randomFood();
  } else snake.pop();
  draw();
}

function setDir(x,y){if(x!==0&&dx===0){ndx=x;ndy=0;}if(y!==0&&dy===0){ndy=y;ndx=0;}}

document.addEventListener('keydown',e=>{
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1],A:[-1,0],D:[1,0],W:[0,-1],S:[0,1]};
  if(e.key===' '){if(!running)startGame();return;}
  if(m[e.key]){e.preventDefault();setDir(...m[e.key]);}
});
// touch swipe
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx2=e.changedTouches[0].clientX-tx,dy2=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx2)<20&&Math.abs(dy2)<20)return;
  if(Math.abs(dx2)>Math.abs(dy2))setDir(dx2<0?-1:1,0);else setDir(0,dy2<0?-1:1);
},{passive:true});
draw();
</script>
</body>
</html>
