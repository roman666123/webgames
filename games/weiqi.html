<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围棋 — DongHaHa Games</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--accent:#f0e040;--accent2:#ff6b35;--text:#f0ede8;--muted:#6b6880;--border:rgba(240,224,64,0.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(240,224,64,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(240,224,64,0.03) 1px,transparent 1px);background-size:60px 60px}
nav{width:100%;max-width:960px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{text-decoration:none;color:var(--muted);font-size:13px;transition:color 0.2s}
.back:hover{color:var(--accent)}
.nav-title{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px 40px}
.mode-row{display:flex;gap:8px}
.mode-btn{padding:6px 18px;font-size:12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif}
.mode-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.info-bar{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px}
.stone-ico{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:4px}
.stone-ico.b{background:radial-gradient(circle at 35% 35%,#555,#000);border:1px solid rgba(255,255,255,0.15)}
.stone-ico.w{background:radial-gradient(circle at 35% 35%,#fff,#bbb);border:1px solid rgba(0,0,0,0.2)}
.score-box{text-align:center}
.score-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
.score-val{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.status-text{font-size:13px;min-width:160px;text-align:center}
.btn-row{display:flex;gap:10px}
.btn{padding:8px 18px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.2s}
.btn:hover{background:var(--surface);border-color:var(--accent)}
canvas{display:block;border-radius:12px;border:1px solid var(--border);cursor:crosshair}
.msg{font-size:13px;color:var(--muted);min-height:20px;text-align:center}
.hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<nav>
  <a class="back" href="../index.html">← 返回首页</a>
  <div class="nav-title">围棋</div>
  <div style="width:60px"></div>
</nav>
<div class="wrap">
  <div class="mode-row">
    <button class="mode-btn active" onclick="setMode('ai')" id="btn-ai">人机对战</button>
    <button class="mode-btn" onclick="setMode('pvp')" id="btn-pvp">双人对战</button>
  </div>
  <div class="info-bar">
    <div class="score-box"><div class="score-label"><span class="stone-ico b"></span>黑方</div><div class="score-val" id="black-cap">0</div></div>
    <div class="score-box"><div class="score-label">提子</div><div style="font-size:10px;color:var(--muted)">黑/白</div></div>
    <div class="status-text" id="status">你先行 — 黑棋</div>
    <div class="score-box"><div class="score-label"><span class="stone-ico w"></span>白方</div><div class="score-val" id="white-cap">0</div></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="btn-row">
    <button class="btn" onclick="resetGame()">重新开始</button>
    <button class="btn" onclick="undoMove()">悔棋</button>
    <button class="btn" onclick="passMove()">弃权</button>
  </div>
  <div class="msg" id="msg">点击交叉点落子</div>
  <div class="hint" id="hint">围棋规则：围住对方棋子可提走，围住更多空间得胜<br>贴目：白方+6.5目</div>
</div>
<script>
const N=19, CELL=32, PAD=28, W=PAD*2+(N-1)*CELL;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=W; cv.height=W;

let board, history, captures, passes, gameOver, playerTurn, mode='ai';
const STAR_POINTS=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];

function setMode(m){
  mode=m;
  document.getElementById('btn-ai').classList.toggle('active',m==='ai');
  document.getElementById('btn-pvp').classList.toggle('active',m==='pvp');
  resetGame();
}

function resetGame(){
  board=Array.from({length:N},()=>Array(N).fill(0));
  history=[];captures={1:0,2:0};passes=0;gameOver=false;playerTurn=true;
  document.getElementById('black-cap').textContent=0;
  document.getElementById('white-cap').textContent=0;
  document.getElementById('msg').textContent='点击交叉点落子';
  const t=mode==='pvp'?'双人对战 — 黑方先行':'你先行 — 黑棋';
  document.getElementById('status').textContent=t;
  draw();
}

function getGroup(r,c,col,visited=new Set()){
  const key=r+','+c;
  if(visited.has(key))return{stones:[],liberties:new Set()};
  visited.add(key);
  let stones=[{r,c}],liberties=new Set();
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    const nk=nr+','+nc;
    if(board[nr][nc]===0)liberties.add(nk);
    else if(board[nr][nc]===col&&!visited.has(nk)){
      const sub=getGroup(nr,nc,col,visited);
      stones=stones.concat(sub.stones);
      sub.liberties.forEach(l=>liberties.add(l));
    }
  }
  return{stones,liberties};
}

function removeGroup(stones){
  for(const{r,c}of stones)board[r][c]=0;
}

function tryPlace(r,c,col){
  if(board[r][c]!==0)return false;
  board[r][c]=col;
  const opp=col===1?2:1;
  let captured=0;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==opp)continue;
    const g=getGroup(nr,nc,opp);
    if(g.liberties.size===0){captured+=g.stones.length;removeGroup(g.stones);}
  }
  const self=getGroup(r,c,col);
  if(self.liberties.size===0&&captured===0){board[r][c]=0;return false;}
  captures[col]+=captured;
  document.getElementById('black-cap').textContent=captures[1];
  document.getElementById('white-cap').textContent=captures[2];
  return true;
}

function aiMove(){
  document.getElementById('status').textContent='AI思考中...';
  setTimeout(()=>{
    let best=null,bestScore=-1;
    const cands=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(board[r][c]!==0)continue;
      let near=false;
      for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2&&!near;dc++){
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc])near=true;
      }
      if(near||history.length<4)cands.push([r,c]);
    }
    if(!cands.length){passMove(true);return;}
    for(const[r,c]of cands){
      let score=Math.random()*5;
      board[r][c]=2;
      const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
      for(const[dr,dc]of dirs){
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==1)continue;
        const g=getGroup(nr,nc,1);
        if(g.liberties.size===1)score+=g.stones.length*20;
        if(g.liberties.size===0)score+=g.stones.length*50;
      }
      score+=(9-Math.abs(r-9))*0.3+(9-Math.abs(c-9))*0.3;
      board[r][c]=0;
      if(score>bestScore){bestScore=score;best=[r,c];}
    }
    if(best){
      const[r,c]=best;
      if(tryPlace(r,c,2)){
        history.push({r,c,col:2,boardSnap:JSON.stringify(board),caps:{...captures}});
        passes=0;
      }
    }
    draw();
    playerTurn=true;
    document.getElementById('status').textContent='轮到你 — 黑棋';
  },400);
}

function passMove(isAI=false){
  passes++;
  history.push({pass:true,col:isAI?2:playerTurn?1:2});
  if(passes>=2){endGame();return;}
  if(mode==='ai'&&!isAI){playerTurn=false;document.getElementById('status').textContent='AI思考中...';aiMove();}
  else if(mode==='pvp'){playerTurn=!playerTurn;document.getElementById('status').textContent=playerTurn?'黑方落子':'白方落子';}
}

function undoMove(){
  if(mode==='ai'){
    if(history.length>=2){
      const h2=history[history.length-2];
      if(!h2.pass){board=JSON.parse(h2.boardSnap);captures={...h2.caps};}
      history.splice(history.length-2,2);
    }else if(history.length===1){history.pop();}
    else return;
    playerTurn=true;
    document.getElementById('status').textContent='轮到你 — 黑棋';
  }else{
    if(!history.length)return;
    const h=history.pop();
    if(!h.pass&&h.boardSnap){const prev=history[history.length-1];board=JSON.parse(h.boardSnap);if(prev&&prev.caps)captures={...prev.caps};}
    playerTurn=h.col===1;
    document.getElementById('status').textContent=playerTurn?'黑方落子':'白方落子';
  }
  document.getElementById('black-cap').textContent=captures[1];
  document.getElementById('white-cap').textContent=captures[2];
  passes=0;draw();
}

function endGame(){
  gameOver=true;
  let black=captures[1],white=captures[2]+6.5;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(board[r][c]===1)black++;else if(board[r][c]===2)white++;}
  const winner=black>white?'黑方':'白方';
  document.getElementById('msg').textContent=`游戏结束！黑:${black.toFixed(1)} 白:${white.toFixed(1)} → ${winner}胜`;
  document.getElementById('status').textContent='游戏结束';
}

function draw(){
  ctx.fillStyle='#c8a84b';ctx.fillRect(0,0,W,W);
  ctx.strokeStyle='#8b6914';ctx.lineWidth=0.8;
  for(let i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(PAD+i*CELL,PAD);ctx.lineTo(PAD+i*CELL,PAD+(N-1)*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,PAD+i*CELL);ctx.lineTo(PAD+(N-1)*CELL,PAD+i*CELL);ctx.stroke();
  }
  for(const[r,c]of STAR_POINTS){
    ctx.fillStyle='#6b4f0a';ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,3.5,0,Math.PI*2);ctx.fill();
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!board[r][c])continue;
    const x=PAD+c*CELL,y=PAD+r*CELL,bl=board[r][c]===1;
    const g=ctx.createRadialGradient(x-3,y-3,2,x,y,CELL*0.44);
    g.addColorStop(0,bl?'#555':'#fff');g.addColorStop(1,bl?'#000':'#bbb');
    ctx.beginPath();ctx.arc(x,y,CELL*0.44,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=bl?'#111':'#888';ctx.lineWidth=0.5;ctx.stroke();
  }
  if(history.length){
    const l=history[history.length-1];
    if(!l.pass){
      ctx.strokeStyle=l.col===1?'#f00':'#00f';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(PAD+l.c*CELL,PAD+l.r*CELL,5,0,Math.PI*2);ctx.stroke();
    }
  }
}

cv.addEventListener('click',e=>{
  if(gameOver)return;
  if(mode==='ai'&&!playerTurn)return;
  const rect=cv.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=W/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  const c=Math.round((x-PAD)/CELL),r=Math.round((y-PAD)/CELL);
  if(r<0||r>=N||c<0||c>=N)return;
  const col=mode==='pvp'?(playerTurn?1:2):1;
  const snap=JSON.stringify(board);
  if(tryPlace(r,c,col)){
    history.push({r,c,col,boardSnap:snap,caps:{...captures}});
    passes=0;draw();
    if(mode==='ai'){playerTurn=false;document.getElementById('status').textContent='AI思考中...';aiMove();}
    else{playerTurn=!playerTurn;document.getElementById('status').textContent=playerTurn?'黑方落子':'白方落子';}
  }
});

resetGame();
</script>
</body>
</html>
