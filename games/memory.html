<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻牌记忆 — DongHaHa Games</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--accent:#a78bfa;--text:#f0ede8;--muted:#6b6880;--border:rgba(167,139,250,0.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(167,139,250,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,0.03) 1px,transparent 1px);background-size:60px 60px}
nav{width:100%;max-width:580px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{text-decoration:none;color:var(--muted);font-size:13px;transition:color 0.2s}
.back:hover{color:var(--accent)}
.nav-title{font-family:'Dela Gothic One',sans-serif;font-size:1.1rem;color:var(--accent)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 16px 40px}
.info-row{display:flex;gap:12px;align-items:center}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 20px;text-align:center;min-width:80px}
.score-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted)}
.score-val{font-family:'Dela Gothic One',sans-serif;font-size:1.3rem;color:var(--accent)}
.btn{padding:10px 20px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all 0.2s}
.btn:hover{background:var(--surface);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;width:100%}
.card{aspect-ratio:1;border-radius:10px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.4s;border:1px solid var(--border)}
.card.flipped,.card.matched{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.card-back{background:var(--surface2);font-size:1.2rem;color:var(--muted)}
.card-front{background:var(--surface);transform:rotateY(180deg);font-size:2rem}
.card.matched .card-front{background:#1a1030;border:1px solid rgba(167,139,250,0.5)}
.msg{font-size:13px;color:var(--muted);min-height:20px}
</style>
</head>
<body>
<nav>
  <a class="back" href="../index.html">← 返回</a>
  <div class="nav-title">翻牌记忆</div>
  <div style="width:60px"></div>
</nav>
<div class="wrap">
  <div class="info-row">
    <div class="score-box"><div class="score-label">步数</div><div class="score-val" id="moves">0</div></div>
    <button class="btn" onclick="reset()">重新开始</button>
    <div class="score-box"><div class="score-label">配对</div><div class="score-val" id="pairs">0/8</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">翻开卡片找到配对</div>
</div>
<script>
const EMOJIS=['🍎','🍊','🍋','🍇','🍓','🎮','⚽','🎯'];
let cards,flipped,matched,moves,lock;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function reset(){
  const deck=shuffle([...EMOJIS,...EMOJIS].map((e,i)=>({e,id:i})));
  cards=deck;flipped=[];matched=0;moves=0;lock=false;
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('msg').textContent='翻开卡片找到配对';
  render();
}
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<div class="card-face card-back">🎴</div><div class="card-face card-front">${c.e}</div>`;
    el.addEventListener('click',()=>flip(i,el));
    grid.appendChild(el);
  });
}
function flip(i,el){
  if(lock||el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');
  flipped.push({i,el,e:cards[i].e});
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;lock=true;
    if(flipped[0].e===flipped[1].e){
      flipped.forEach(f=>{f.el.classList.remove('flipped');f.el.classList.add('matched');});
      matched++;document.getElementById('pairs').textContent=`${matched}/8`;
      flipped=[];lock=false;
      if(matched===8)document.getElementById('msg').textContent=`🎉 完成！共走了 ${moves} 步`;
    } else {
      setTimeout(()=>{flipped.forEach(f=>f.el.classList.remove('flipped'));flipped=[];lock=false;},900);
    }
  }
}
reset();
</script>
</body>
</html>
